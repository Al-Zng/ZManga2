name: iOS Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build Archive
        run: xcodebuild archive -project ZAnime.xcodeproj -scheme ZAnime -archivePath ZAnime.xcarchive CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Create IPA manually
        run: |
          mkdir Payload
          cp -R ZAnime.xcarchive/Products/Applications/ZAnime.app Payload/
          zip -r ZAnime.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAnime-IPA
          path: ZAnime.ipa